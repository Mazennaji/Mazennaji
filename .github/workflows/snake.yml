name: Contribution snake

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Mazennaji
          github_token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            assets/contribution-snake.svg?color_snake=#a78bfa&color_dots=#1a0f33,#4c1d95,#6d28d9,#8b5cf6,#c4b5fd
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg
          git diff --cached --quiet || git commit -m "chore: refresh snake"
          git pull --rebase
          git push