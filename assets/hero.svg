<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#000000"/>
<stop offset="0.5" stop-color="#120025"/>
<stop offset="1" stop-color="#2a0066"/>
</linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#ffffff"/>
<stop offset="0.5" stop-color="#c4b5fd"/>
<stop offset="1" stop-color="#8b5cf6"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
<stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
</linearGradient>
<radialGradient id="orbA">
<stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
<stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
</radialGradient>
<radialGradient id="orbB">
<stop offset="0" stop-color="#a78bfa" stop-opacity="0.4"/>
<stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
</radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#7c3aed" stroke-opacity="0.14"/>
<animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
</pattern>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
<feGaussianBlur stdDeviation="10"/>
</filter>
<clipPath id="reveal">
<rect y="205" height="40" x="600" width="0">
<animate attributeName="x" from="600" to="130" dur="1.4s" begin="1s" fill="freeze"/>
<animate attributeName="width" from="0" to="940" dur="1.4s" begin="1s" fill="freeze"/>
</rect>
</clipPath>
</defs>
<rect width="1200" height="360" fill="url(#bg)"/>
<rect width="1200" height="360" fill="url(#grid)"/>
<circle cx="220" cy="120" r="170" fill="url(#orbA)">
<animate attributeName="cx" values="220;330;220" dur="9s" repeatCount="indefinite"/>
<animate attributeName="cy" values="120;170;120" dur="11s" repeatCount="indefinite"/>
</circle>
<circle cx="980" cy="240" r="200" fill="url(#orbB)">
<animate attributeName="cx" values="980;880;980" dur="10s" repeatCount="indefinite"/>
<animate attributeName="cy" values="240;180;240" dur="12s" repeatCount="indefinite"/>
</circle>
<g fill="#c4b5fd">
<circle cx="90" cy="380" r="2"><animate attributeName="cy" from="380" to="-20" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="210" cy="380" r="1.5"><animate attributeName="cy" from="380" to="-20" dur="7s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" begin="1s" repeatCount="indefinite"/></circle>
<circle cx="340" cy="380" r="2.5"><animate attributeName="cy" from="380" to="-20" dur="11s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
<circle cx="470" cy="380" r="1.5"><animate attributeName="cy" from="380" to="-20" dur="8s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="8s" begin="0.5s" repeatCount="indefinite"/></circle>
<circle cx="590" cy="380" r="2"><animate attributeName="cy" from="380" to="-20" dur="10s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10s" begin="3s" repeatCount="indefinite"/></circle>
<circle cx="720" cy="380" r="1.5"><animate attributeName="cy" from="380" to="-20" dur="7.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/></circle>
<circle cx="850" cy="380" r="2.5"><animate attributeName="cy" from="380" to="-20" dur="12s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="12s" begin="2.5s" repeatCount="indefinite"/></circle>
<circle cx="970" cy="380" r="2"><animate attributeName="cy" from="380" to="-20" dur="9s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="4s" repeatCount="indefinite"/></circle>
<circle cx="1090" cy="380" r="1.5"><animate attributeName="cy" from="380" to="-20" dur="8s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="8s" begin="0.8s" repeatCount="indefinite"/></circle>
<circle cx="1150" cy="380" r="2"><animate attributeName="cy" from="380" to="-20" dur="10s" begin="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10s" begin="3.5s" repeatCount="indefinite"/></circle>
</g>
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" dur="1.2s" fill="freeze"/>
<text x="600" y="185" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="12" fill="#7c3aed" filter="url(#glow)" opacity="0.7">MAZEN NAJI</text>
<text x="600" y="185" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="12" fill="url(#name)">MAZEN NAJI</text>
</g>
<g clip-path="url(#reveal)">
<text x="600" y="232" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="19" letter-spacing="5" fill="#c4b5fd">SOFTWARE ENGINEER · FULL STACK · AI ENGINEER</text>
</g>
<rect x="600" y="256" width="0" height="2" rx="1" fill="#a78bfa">
<animate attributeName="x" from="600" to="420" dur="1s" begin="2s" fill="freeze"/>
<animate attributeName="width" from="0" to="360" dur="1s" begin="2s" fill="freeze"/>
</rect>
<path d="M0 300 Q150 270 300 300 T600 300 T900 300 T1200 300 T1500 300 T1800 300 T2100 300 T2400 300 V360 H0 Z" fill="url(#wave)" opacity="0.7">
<animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="14s" repeatCount="indefinite"/>
</path>
<path d="M0 322 Q150 296 300 322 T600 322 T900 322 T1200 322 T1500 322 T1800 322 T2100 322 T2400 322 V360 H0 Z" fill="url(#wave)" opacity="0.9">
<animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="9s" repeatCount="indefinite"/>
</path>
</svg>