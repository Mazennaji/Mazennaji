<svg xmlns="http://www.w3.org/2000/svg" width="495" height="220" viewBox="0 0 495 220">
<defs>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
<stop offset="0.5" stop-color="#c4b5fd"/>
<stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
</linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#a78bfa"/>
<stop offset="1" stop-color="#6d28d9"/>
</linearGradient>
<linearGradient id="ul" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#a78bfa"/>
<stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
</linearGradient>
<radialGradient id="orb">
<stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
<stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="4"/>
</filter>
</defs>
<rect x="1" y="1" width="493" height="218" rx="20" fill="#0d0020" fill-opacity="0.35" stroke="#2a1a4d" stroke-width="1.5"/>
<rect x="1" y="1" width="493" height="218" rx="20" fill="none" stroke="url(#sheen)" stroke-width="2.5" pathLength="1000" stroke-dasharray="140 860">
<animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" repeatCount="indefinite"/>
</rect>
<circle cx="392" cy="125" r="60" fill="url(#orb)">
<animate attributeName="r" values="52;70;52" dur="4s" repeatCount="indefinite"/>
</circle>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="28" y="40" font-size="18" font-weight="700" fill="#e0d0ff">GitHub Stats</text>
<rect x="28" y="49" width="0" height="2" rx="1" fill="url(#ul)"><animate attributeName="width" from="0" to="110" dur="1s" begin="0.2s" fill="freeze"/></rect>
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.30s" fill="freeze"/>
<path d="M28 76 l5 5 l-5 5 l-5 -5Z" fill="#7c3aed"/>
<text x="44" y="86" font-size="14" fill="#a78bfa">Total Stars</text>
<text x="290" y="86" font-size="15" font-weight="700" fill="#ffffff" text-anchor="end">3</text>
</g>
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.45s" fill="freeze"/>
<path d="M28 104 l5 5 l-5 5 l-5 -5Z" fill="#7c3aed"/>
<text x="44" y="114" font-size="14" fill="#a78bfa">Total Commits</text>
<text x="290" y="114" font-size="15" font-weight="700" fill="#ffffff" text-anchor="end">3,467</text>
</g>
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.60s" fill="freeze"/>
<path d="M28 132 l5 5 l-5 5 l-5 -5Z" fill="#7c3aed"/>
<text x="44" y="142" font-size="14" fill="#a78bfa">Pull Requests</text>
<text x="290" y="142" font-size="15" font-weight="700" fill="#ffffff" text-anchor="end">2</text>
</g>
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.75s" fill="freeze"/>
<path d="M28 160 l5 5 l-5 5 l-5 -5Z" fill="#7c3aed"/>
<text x="44" y="170" font-size="14" fill="#a78bfa">Issues</text>
<text x="290" y="170" font-size="15" font-weight="700" fill="#ffffff" text-anchor="end">0</text>
</g>
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.90s" fill="freeze"/>
<path d="M28 188 l5 5 l-5 5 l-5 -5Z" fill="#7c3aed"/>
<text x="44" y="198" font-size="14" fill="#a78bfa">Followers</text>
<text x="290" y="198" font-size="15" font-weight="700" fill="#ffffff" text-anchor="end">14</text>
</g>
<g transform="rotate(-90 392 125)">
<circle cx="392" cy="125" r="42" fill="none" stroke="#2a1a4d" stroke-width="7"/>
<circle cx="392" cy="125" r="42" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9">
<animate attributeName="stroke-dashoffset" from="263.9" to="204.3" dur="1.8s" begin="0.5s" fill="freeze"/>
</circle>
</g>
<g>
<animateTransform attributeName="transform" type="rotate" from="0 392 125" to="360 392 125" dur="6s" repeatCount="indefinite"/>
<circle cx="392" cy="83" r="4" fill="#ddd6fe" filter="url(#glow)"/>
</g>
<text x="392" y="133" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">C+</text>
<text x="392" y="152" font-size="10" letter-spacing="3" fill="#6b5fa0" text-anchor="middle">RANK</text>
</g>
</svg>